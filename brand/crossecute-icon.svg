<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="crossecute">
  <title>crossecute</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6D5AE6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6D5AE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141A33"/>
      <stop offset="100%" stop-color="#0A0E1F"/>
    </linearGradient>
  </defs>

  <!-- avatar tile -->
  <rect x="0" y="0" width="256" height="256" rx="60" fill="url(#bg)"/>
  <circle cx="128" cy="120" r="96" fill="url(#glow)"/>

  <!-- chain ring: the network of destination chains -->
  <path d="M214 128 L171 202.48 L85 202.48 L42 128 L85 53.52 L171 53.52 Z"
        fill="none" stroke="#3C4373" stroke-width="2" stroke-opacity="0.55" stroke-linejoin="round"/>

  <!-- spokes: control radiating from the hub to every chain (masked at center by the diamond) -->
  <g stroke="#5B6493" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="128" x2="203"   y2="128"/>
    <line x1="128" y1="128" x2="165.5" y2="193"/>
    <line x1="128" y1="128" x2="90.5"  y2="193"/>
    <line x1="128" y1="128" x2="53"    y2="128"/>
    <line x1="128" y1="128" x2="90.5"  y2="63"/>
    <line x1="128" y1="128" x2="165.5" y2="63"/>
  </g>

  <!-- destination chain nodes -->
  <g fill="#C7D2FE">
    <circle cx="214" cy="128" r="11"/>
    <circle cx="171" cy="202.48" r="11"/>
    <circle cx="85"  cy="202.48" r="11"/>
    <circle cx="42"  cy="128" r="11"/>
    <circle cx="85"  cy="53.52" r="11"/>
    <circle cx="171" cy="53.52" r="11"/>
  </g>

  <!-- the signing hub: an Ethereum diamond, the expected anchor -->
  <g>
    <polygon points="128,78 128,136 98,136"  fill="#B7A6FF"/>
    <polygon points="128,78 158,136 128,136" fill="#9A85F7"/>
    <polygon points="98,144 128,144 128,184" fill="#8B79F3"/>
    <polygon points="158,144 128,144 128,184" fill="#6E5CEA"/>
  </g>
</svg>
