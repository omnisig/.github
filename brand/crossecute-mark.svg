<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="crossecute">
  <title>crossecute</title>
  <!-- chain ring: the network of destination chains -->
  <path d="M214 128 L171 202.48 L85 202.48 L42 128 L85 53.52 L171 53.52 Z"
        fill="none" stroke="#94A3B8" stroke-width="2" stroke-opacity="0.6" stroke-linejoin="round"/>

  <!-- spokes -->
  <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="128" x2="203"   y2="128"/>
    <line x1="128" y1="128" x2="165.5" y2="193"/>
    <line x1="128" y1="128" x2="90.5"  y2="193"/>
    <line x1="128" y1="128" x2="53"    y2="128"/>
    <line x1="128" y1="128" x2="90.5"  y2="63"/>
    <line x1="128" y1="128" x2="165.5" y2="63"/>
  </g>

  <!-- destination chain nodes -->
  <g fill="#6366F1">
    <circle cx="214" cy="128" r="11"/>
    <circle cx="171" cy="202.48" r="11"/>
    <circle cx="85"  cy="202.48" r="11"/>
    <circle cx="42"  cy="128" r="11"/>
    <circle cx="85"  cy="53.52" r="11"/>
    <circle cx="171" cy="53.52" r="11"/>
  </g>

  <!-- the signing hub: an Ethereum diamond, the expected anchor -->
  <g>
    <polygon points="128,78 128,136 98,136"  fill="#A78BFA"/>
    <polygon points="128,78 158,136 128,136" fill="#8B5CF6"/>
    <polygon points="98,144 128,144 128,184" fill="#7C6CF0"/>
    <polygon points="158,144 128,144 128,184" fill="#6D28D9"/>
  </g>
</svg>
